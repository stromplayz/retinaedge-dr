# Mobile-student config — knowledge-distillation target for edge deployment.
#
# Student backbone mobilenetv3_small_050 (~0.24M params vs 1.5M for small_100)
# cuts ONNX size ~3x and TFLite int8 lands ~0.6-0.8MB — well inside the
# sub-1MB "ultra-lite" tier. Pair with configs/train/online_pilot.yaml as the
# data/loss base; distill.py only overrides the model section + epochs.
data:
  dataset: aptos
  root: data/online_dr
  img_size: 160
  batch_size: 64          # small student allows larger batches on CPU
  num_workers: 3
  clahe_prob: 0.5
  ben_graham: false
  val_fraction: 0.15
  test_fraction: 0.05
  split_salt: online_v1   # SAME salt as teacher run -> identical split, no leakage

model:
  backbone: mobilenetv3_small_050   # the mobile-fit student
  pretrained: true
  dropout: 0.1
  num_grades: 5

train:
  epochs: 10
  lr: 0.0015
  weight_decay: 0.02
  warmup_epochs: 1
  grad_clip: 5.0
  amp: false
  ema: true               # EMA stabilizes small students
  sampler: true
  patience: 4
  seed: 42
  save_dir: artifacts/distill/student
  loss:
    ordinal_weight: 1.0
    refer_weight: 0.3
    focal_gamma: 2.0

eval:
  batch_size: 128
