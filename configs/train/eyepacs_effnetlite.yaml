# Secondary config: EyePACS + EfficientNet-Lite0 (larger data, still edge-friendly).
# EyePACS labels are noisier (grades from the 2015 Kaggle competition) — use as
# pre-training or co-training source; validate externally before trusting numbers.
data:
  dataset: eyepacs
  root: data/eyepacs
  img_size: 224
  batch_size: 48
  num_workers: 8
  clahe_prob: 0.5
  ben_graham: true
  ben_graham_radius: 300
  val_fraction: 0.10
  test_fraction: 0.02
  split_salt: eyepacs_v1

model:
  backbone: efficientnet_lite0
  pretrained: true
  dropout: 0.2
  num_grades: 5

train:
  epochs: 20
  lr: 0.0006
  weight_decay: 0.02
  warmup_epochs: 1
  grad_clip: 5.0
  amp: true
  ema: true
  sampler: true
  patience: 4
  seed: 42
  save_dir: artifacts/eyepacs_enl0
  loss:
    ordinal_weight: 1.0
    refer_weight: 0.3
    focal_gamma: 2.0

eval:
  batch_size: 64
