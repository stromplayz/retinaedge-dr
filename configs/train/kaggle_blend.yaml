# Kaggle multi-source DR blend — maximum-data training config.
#
# Corpus (built by `python -m retinaedge.data.manifest_import` from the Kaggle
# dataset jin0507/ddr-aptos-2019-idrid-and-messidor-2-256-x-256):
#   18,383 fundus images, ICDRSS grades 0-4, four sources:
#     DDR 12,522 | APTOS 3,662 | Messidor-2 1,744 | IDRiD 455
#   with PATIENT-AWARE splits shipped in labels.csv (train 14,706 / val 1,843 /
#   test 1,834; zero patient overlap across splits). The split column is
#   honored by retinaedge.data.dataset (hash splits are bypassed when present).
#
# External validation: data/messidor2_ext (1,744 Messidor-2 images with
# google-brain 5-level adjudicated grades) — evaluate only, never train/tune.
data:
  dataset: aptos            # generic images/ + labels.csv reader
  root: data/kaggle_blend
  img_size: 224
  batch_size: 32
  num_workers: 3
  clahe_prob: 0.5
  ben_graham: false         # source images are already cropped/resized at 256px
  val_fraction: 0.15        # ignored: labels.csv carries an explicit split column
  test_fraction: 0.0
  split_salt: kaggle_blend_v1

model:
  backbone: mobilenetv3_small_100
  pretrained: true
  dropout: 0.2
  num_grades: 5

train:
  epochs: 8
  lr: 0.001
  weight_decay: 0.02
  warmup_epochs: 1
  grad_clip: 5.0
  amp: false
  ema: true                 # EMA weights: the first rung of the soup trick
  sampler: true             # grades 1/3 are rare — inverse-frequency sampling
  patience: 4
  seed: 42
  save_dir: artifacts/kaggle_blend
  loss:
    ordinal_weight: 1.0
    refer_weight: 0.3
    focal_gamma: 2.0

eval:
  batch_size: 64
