# Continuous Integration — RetinaEdge-DR (owner: 2-e, per docs/INTERFACES.md §GitHub workflows)
#
# Jobs: lint (ruff) + unit tests (pytest) + smoke pipeline (synthetic CPU end-to-end)
#       + packaging build (sdist/wheel + twine check).
# The smoke job self-enables as soon as retinaedge.train/eval/export are importable;
# before that it skips with a warning instead of failing the branch.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: python -m pip install "ruff>=0.4"

      - name: Ruff check
        # Same scope as `make lint` (src tests scripts demo); demo/ is included
        # only once it exists so the gate stays green during staged rollout.
        run: |
          DIRS="src tests scripts"
          if [ -d demo ]; then DIRS="$DIRS demo"; fi
          ruff check $DIRS

      - name: Ruff format (check only)
        run: |
          DIRS="src tests scripts"
          if [ -d demo ]; then DIRS="$DIRS demo"; fi
          ruff format --check $DIRS

  pytest:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-env
        with:
          extras: dev

      - name: Environment sanity check
        run: python scripts/verify_env.py

      - name: Run unit tests
        run: python -m pytest -q -m "not slow"

  smoke:
    name: Smoke pipeline (synthetic CPU end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-env
        with:
          extras: dev

      - name: Preflight — are train/eval/export modules implemented?
        id: preflight
        run: |
          if python -c "import retinaedge.train.trainer, retinaedge.eval.evaluate, retinaedge.export.export_onnx, retinaedge.export.benchmark" 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::retinaedge train/eval/export modules not implemented yet — smoke pipeline skipped (auto-enables once they land)"
          fi

      - name: Run smoke pipeline (train -> eval -> export -> benchmark)
        if: steps.preflight.outputs.ready == 'true'
        run: make smoke

      - name: Upload smoke artifacts
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts
          path: artifacts/smoke/
          retention-days: 7
          if-no-files-found: error

  build:
    name: Package build (sdist + wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Ensure README.md exists (temporary shim until the real one lands)
        run: |
          if [ ! -f README.md ]; then
            printf '# retinaedge-dr\n\nDiabetic Retinopathy detection at the mobile edge (PyTorch -> ONNX -> TFLite int8).\n' > README.md
          fi

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
