# Continuous improvement loop — escalate toward the accuracy goal (default 97%
# referable-DR accuracy) using the full loophole stack (TTA + soup + cut-point
# decoding + threshold search), then commit progress back to the repo.
#
# CADENCE: runs every 3 hours on schedule (plus manual dispatch). Each run
# resumes the campaign state, trains up to max_stages ladder stages, escalates
# the budget round when a ladder completes without the goal, and cuts a
# semantic release (v0.4.0, ... -> v1.0.0) whenever the champion improves by
# >= 0.005 or the goal is reached (scripts/bump_release.py decides).
#
# Each invocation is RESUMABLE: runs/improve_state.json records completed
# ladder stages, so scheduled runs continue the campaign instead of repeating
# work. Logs (runs/improvement_log.md) and state are committed back so the
# loop is auditable in git history.
#
# Data sources (input `dataset_mode`):
#   hf      — resolve a public HF fundus dataset (anonymous, no secrets needed)
#   kaggle  — pull a Kaggle dataset with the KAGGLE_API_TOKEN secret
#   synthetic — no data download (plumbing/calibration run only)

name: Continuous improve (ladder toward 97%)

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Ladder budget profile"
        type: choice
        options: [small, medium, full]
        default: small
      target:
        description: "Accuracy goal (referable DR)"
        default: "0.97"
      max_stages:
        description: "Max ladder stages per invocation (3h cadence: keep runs bounded)"
        default: "3"
      max_rounds:
        description: "Campaign rounds before escalation stops (budget small->medium->full)"
        default: "10"
      config:
        description: "Training config (blank = auto: kaggle->kaggle_blend, hf->online_pilot)"
        default: ""
      dataset_mode:
        description: "Data source for this run"
        type: choice
        options: [hf, kaggle, synthetic]
        default: kaggle
      kaggle_dataset:
        description: "Kaggle dataset handle (dataset_mode=kaggle)"
        default: "jin0507/ddr-aptos-2019-idrid-and-messidor-2-256-x-256"
      hf_repo:
        description: "Explicit HF dataset id (dataset_mode=hf, blank = auto-search)"
        default: ""
      require_ci:
        description: "Goal only counts when Wilson CI lower bound clears target"
        type: boolean
        default: false
  schedule:
    # Every 3 hours (xx:17 UTC) — the campaign advances around the clock:
    # each run resumes runs/improve_state.json, trains up to max_stages ladder
    # stages, and on improvement cuts a cadence release toward v1.0.0.
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: improve-loop
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      INPUTS_BUDGET: ${{ inputs.budget || 'small' }}
      INPUTS_TARGET: ${{ inputs.target || '0.97' }}
      INPUTS_MAX_STAGES: ${{ inputs.max_stages || '3' }}
      INPUTS_MAX_ROUNDS: ${{ inputs.max_rounds || '10' }}
      INPUTS_CONFIG: ${{ inputs.config || '' }}
      INPUTS_MODE: ${{ inputs.dataset_mode || 'kaggle' }}
      INPUTS_KAGGLE: ${{ inputs.kaggle_dataset || 'jin0507/ddr-aptos-2019-idrid-and-messidor-2-256-x-256' }}
      INPUTS_HF: ${{ inputs.hf_repo || '' }}
      INPUTS_REQUIRE_CI: ${{ inputs.require_ci || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk (remove preinstalled bloat)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h / | tail -1

      - uses: ./.github/actions/setup-env
        with:
          extras: dev
          cpu_torch: "true"

      - name: Restore champion checkpoints (cross-run continuity for soup/distill)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow improve.yml --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // ""')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" -n improve-run -D /tmp/restore || true
          fi
          if [ -n "$(find /tmp/restore -name '*.pt' -print -quit 2>/dev/null)" ]; then
            mkdir -p runs
            cp -a /tmp/restore/runs/. runs/
            echo "restored checkpoints from improve-run artifact (run $RUN_ID)"
          else
            echo "no prior checkpoint artifact — fresh ladder (distill falls back to trainer)"
          fi

      - name: Install data stack (kagglehub + HF)
        run: python -m pip install "kagglehub>=1.0" "datasets>=2.19" "huggingface_hub>=0.23"

      - name: Resolve dataset (Kaggle)
        if: env.INPUTS_MODE == 'kaggle'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          HANDLE="$INPUTS_KAGGLE"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ROT=$(python scripts/rotate_dataset.py \
              --catalog configs/data/kaggle_dr_catalog.yaml \
              --state runs/improve_state.json || true)
            if [ -n "$ROT" ] && [ "$ROT" != "$INPUTS_KAGGLE" ]; then HANDLE="$ROT"; fi
          fi
          echo "dataset handle: $HANDLE"
          if ! python -m retinaedge.data.download_kaggle --handle "$HANDLE" --dest data/blend_raw; then
            if [ "$HANDLE" = "$INPUTS_KAGGLE" ]; then
              exit 1
            fi
            echo "rotated handle failed — falling back to the default handle"
            python -m retinaedge.data.download_kaggle --handle "$INPUTS_KAGGLE" --dest data/blend_raw
          fi
          # Manifest-style blends (image_path/grade/split CSVs) -> standard layout
          if python -m retinaedge.data.manifest_import --raw data/blend_raw/raw --out data/kaggle_blend; then
            echo "manifest blend imported"
          else
            echo "no manifest found - falling back to prepare.py"
            python -m retinaedge.data.prepare --config "${CONFIG:-configs/train/kaggle_blend.yaml}" --root data/kaggle_blend --force
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, collections
          p = pathlib.Path("data/kaggle_blend/labels.csv")
          if p.exists():
              rows = list(csv.DictReader(p.open())) if (csv := __import__("csv")) else []
              grades = collections.Counter(r["grade"] for r in rows)
              splits = collections.Counter(r.get("split", "hash") for r in rows)
              prov = pathlib.Path("data/kaggle_blend/provenance.json")
              src = json.loads(prov.read_text()).get("manifest", "?") if prov.exists() else "?"
              print(f"### Kaggle dataset resolved (manifest: `{src}`)")
              print(f"- images: {len(rows)}\n- grade counts: {dict(sorted(grades.items()))}")
              print(f"- splits: {dict(sorted(splits.items()))}")
          PY

      - name: Resolve dataset (Hugging Face)
        if: env.INPUTS_MODE == 'hf'
        run: |
          set -euo pipefail
          ARGS=(--out data/online_dr --json artifacts/online/provenance.json)
          if [ -n "$INPUTS_HF" ]; then ARGS+=(--repo "$INPUTS_HF"); fi
          python -m retinaedge.data.resolve_hf "${ARGS[@]}" --bake-ben-graham

      - name: Skip data download (synthetic)
        if: env.INPUTS_MODE == 'synthetic'
        run: echo "synthetic run — no data download"

      - name: Run improvement ladder (resumable)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          CONFIG="$INPUTS_CONFIG"
          if [ -z "$CONFIG" ]; then
            if [ "$INPUTS_MODE" = "kaggle" ]; then CONFIG=configs/train/kaggle_blend.yaml; else CONFIG=configs/train/online_pilot.yaml; fi
          fi
          echo "config: $CONFIG | mode: $INPUTS_MODE | budget: $INPUTS_BUDGET"
          EXTRA=()
          if [ "$INPUTS_REQUIRE_CI" = "true" ]; then EXTRA+=(--require-ci); fi
          python -m retinaedge.train.auto_improve \
            --config "$CONFIG" \
            --budget "$INPUTS_BUDGET" \
            --target "$INPUTS_TARGET" \
            --max-stages "$INPUTS_MAX_STAGES" \
            --max-rounds "$INPUTS_MAX_ROUNDS" \
            --state runs/improve_state.json \
            --log runs/improvement_log.md \
            ${EXTRA[@]+"${EXTRA[@]}"}

      - name: Decide version bump (campaign -> semver toward 1.0.0)
        id: bump
        run: |
          python scripts/bump_release.py \
            --state runs/improve_state.json \
            --version-state runs/version_state.json \
            --out runs/release_notes.md \
            --min-delta 0.005

      - name: Job summary (campaign state)
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json, pathlib
          p = pathlib.Path("runs/improve_state.json")
          if p.exists():
              d = json.loads(p.read_text())
              b = d.get("best") or {}
              print("### Improvement campaign state")
              print(f"- goal: {d.get('target')} | budget: {d.get('budget')} | reached: {d.get('goal_reached')}")
              if b:
                  print(f"- best: acc_refer **{b.get('acc_refer')}** (CI lo {b.get('ci95_lo')}), "
                        f"QWK {b.get('qwk')} @ stage `{b.get('stage')}` variant `{b.get('variant')}`")
              for h in d.get("history", [])[-5:]:
                  print(f"- {h.get('stage')}: acc_refer={h.get('acc_refer')}, qwk={h.get('qwk')}")
          log = pathlib.Path("runs/improvement_log.md")
          if log.exists():
              print("\n<details><summary>improvement_log.md (tail)</summary>\n")
              print("```")
              print("".join(log.read_text().splitlines(keepends=True)[-40:]))
              print("```\n</details>")
          PY

      - name: Upload run artifacts (thresholds, eval jsons)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: improve-run
          path: |
            runs/
            artifacts/online/provenance.json
          retention-days: 14

      - name: Commit progress back to the repo (continuous loop)
        run: |
          git config user.name "retinaedge-bot"
          git config user.email "retinaedge-bot@users.noreply.github.com"
          git add runs/improvement_log.md runs/improve_state.json runs/version_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(improve): campaign progress $(date -u +%Y-%m-%dT%H:%MZ)" \
              -m "Auto-committed by the continuous-improve workflow (state + log + version ledger only, no data/models)."
            git push
          fi

      - name: Tag + release on improvement (cadence versions toward v1.0.0)
        if: steps.bump.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
          BUMP_CKPT: ${{ steps.bump.outputs.ckpt }}
        run: |
          set -euo pipefail
          git config user.name "retinaedge-bot"
          git config user.email "retinaedge-bot@users.noreply.github.com"
          git tag -a "$BUMP_TAG" -m "RetinaEdge-DR $BUMP_TAG — automated improvement release"
          git push origin "$BUMP_TAG"
          ARGS=(--title "RetinaEdge-DR $BUMP_TAG" --notes-file runs/release_notes.md)
          if [ -n "$BUMP_CKPT" ] && [ -f "$BUMP_CKPT" ]; then
            ARGS+=("$BUMP_CKPT#champion-checkpoint-$BUMP_TAG")
          fi
          gh release create "$BUMP_TAG" "${ARGS[@]}"
