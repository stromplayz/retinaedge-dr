[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retinaedge-dr"
version = "0.1.0"
description = "Diabetic Retinopathy detection at the mobile edge: PyTorch -> ONNX -> TFLite int8, Android-ready, ordinal grading, open-source stack."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "stromplayz and contributors" }]
keywords = [
  "diabetic-retinopathy",
  "retina",
  "edge-ai",
  "tflite",
  "onnx",
  "pytorch",
  "android",
  "quantization",
  "ordinal-regression",
  "medical-imaging",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0.3",
  "albumentations>=1.4.0",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pillow>=10.2",
  "pyyaml>=6.0",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
  "kagglehub>=0.2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "onnx>=1.15",
  "onnxruntime>=1.17",
]
hf = [
  "datasets>=2.19",
  "huggingface_hub>=0.23",
]
demo = [
  "gradio>=4.36",
]
export = [
  "onnx>=1.15",
  "onnxruntime>=1.17",
  "onnx2tf>=2.6",
  "onnx-graphsurgeon>=0.5",
  "ai-edge-torch>=0.3",
]

[project.urls]
Repository = "https://github.com/stromplayz/retinaedge-dr"
Issues = "https://github.com/stromplayz/retinaedge-dr/issues"

[project.scripts]
retinaedge-train = "retinaedge.train.trainer:main"
retinaedge-eval = "retinaedge.eval.evaluate:main"
retinaedge-export-onnx = "retinaedge.export.export_onnx:main"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: slow tests (deselect with '-m \"not slow\"')",
  "requires_onnx: tests that need onnx/onnxruntime installed",
]
